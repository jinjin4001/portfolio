<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAFA">
  <title>The Keyring — Jin Liu</title>
  <style>
    *{box-sizing:border-box}
    :root{--paper:#FAFAFA;--ink:#000;--muted:#797979;--font:'PP Neue Montreal',Arial,sans-serif}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1440px,100%);margin:0 auto;padding:0 16px}
    .topbar{height:64px;display:flex;align-items:center;justify-content:space-between}
    .brand,.nav{font-size:16px;font-weight:500;letter-spacing:0}
    .nav{display:flex;gap:36px}
    .brand,.nav a,.back,.footer a{position:relative}
    .brand:after,.nav a:after,.footer a:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:#000;transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
    .brand:hover:after,.brand:focus-visible:after,.nav a:hover:after,.nav a:focus-visible:after,.footer a:hover:after,.footer a:focus-visible:after{transform:scaleX(1)}
    .back{display:inline-block;margin:42px 0 62px;font-size:14px}
    .back:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:#000;transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
    .back:hover:after{transform:scaleX(1)}
    .project-heading{display:block;padding-top:22px;margin-bottom:32px}
    .eyebrow{font-size:14px;color:var(--muted);margin:0 0 16px}
    h1{font-weight:500;font-size:40px;line-height:.94;letter-spacing:0.5px;margin:0}
    .page-description{margin:12px 0 0;color:#000;font-size:16px;line-height:1.4;font-weight:500;max-width:calc(50% - 8px);text-align:left}
    .hero{width:100vw;max-width:none;margin:0 calc(50% - 50vw) 32px;position:relative;overflow:hidden;display:grid;place-items:center;min-height:440px;padding:clamp(32px,7vw,100px) 0;border-radius:0;background:linear-gradient(135deg,#e6e7e9 0%,#d4d6d9 48%,#f0f0f1 100%)}
    .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,#fff9 0%,#fff2 38%,transparent 72%);pointer-events:none}
    .hero img{position:relative;display:block;width:100%;height:auto;border-radius:0;box-shadow:0 30px 90px #16191f30,0 3px 12px #16191f18}
    .details{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(170px,.65fr) minmax(130px,.65fr) minmax(60px,.2fr);gap:clamp(24px,2.5vw,40px);row-gap:34px;padding:0 0 70px}.detail-role{grid-column:auto}
    .detail-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
    .detail-value{font-size:16px;font-weight:500;line-height:1.4}
    .footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:14px;font-weight:500;letter-spacing:0}
    @media(max-width:700px){.topbar{height:56px}.nav{gap:20px}.back{margin:30px 0 44px}.project-heading{display:block;margin-bottom:25px}.page-description{margin-top:12px;font-size:16px;line-height:1.4;font-weight:500;color:#000;max-width:36ch}.hero{margin-bottom:20px;min-height:0;padding:24px 0;border-radius:0}.details{grid-template-columns:1fr;gap:20px;padding:24px 0 48px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  
    .cursor-dot{position:fixed;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#FF6600;opacity:1;visibility:hidden;pointer-events:none;z-index:9999;will-change:transform,opacity;mix-blend-mode:normal}.cursor-dot.is-visible{opacity:1;visibility:visible}@media(pointer:coarse){.cursor-dot{display:none}}@media(prefers-reduced-motion:reduce){.cursor-dot{transition:none}}
@media(pointer:fine){body,body *{cursor:none!important}}
/* Keep short pages full-height and naturally push the footer down. */
html,body{min-height:100%}body{min-height:100vh;min-height:100svh}.wrap{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}main{flex:1}

.footer a:hover,.footer a:focus-visible,.footer a:active{color:#286AED}
.footer a:hover:after,.footer a:focus-visible:after,.footer a:active:after{background:#286AED}
.copyright-mark{color:#797979}.copyright-copy{color:#797979}

/* Keep the navigation gutter fixed and balanced across viewport widths. */
.topbar{width:calc(100vw - 32px);margin-left:calc(50% - (100vw - 32px)/2)}
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="index.html">Jin Liu</a>
      <nav class="nav" aria-label="Main navigation"><a href="index.html#work">Works</a><a href="bites.html">Bites</a><a href="about.html">Info</a></nav>
    </header>
    <main>
      <section class="hero" aria-label="Project interface preview">
        <img src="assets/project-01-side-panel.png" alt="Neptune Appcode user permissions side panel interface">
      </section>
      <section class="project-heading">
        <h1>The Keyring</h1>
      </section>
      <section class="details" aria-label="Project details">
        <div><div class="detail-label">Intro</div><div class="detail-value">A clearer way for teams to manage user access and permissions across multiple services.</div></div>
        <div class="detail-role"><div class="detail-label">My Role</div><div class="detail-value">Product design<br>Interaction design<br>Product strategy</div></div>
        <div><div class="detail-label">Tag</div><div class="detail-value">Access management<br>Enterprise SaaS<br>UX</div></div>
        <div><div class="detail-label">Year</div><div class="detail-value">2024</div></div>
      </section>
    </main>
    <footer class="footer"><span class="copyright-copy"><span class="copyright-mark">©</span> 2027 Jin Liu</span><a href="https://www.linkedin.com/" target="_blank" rel="noreferrer">LinkedIn ↗</a></footer>
  </div>
<script>
  (() => {
    if (!window.matchMedia('(pointer: fine)').matches) return;
    const dot = document.createElement('span');
    dot.className = 'cursor-dot';
    dot.setAttribute('aria-hidden', 'true');
    document.body.appendChild(dot);
    let targetX = -20, targetY = -20, x = -20, y = -20, frame = 0;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const draw = () => {
      if (reducedMotion) { x = targetX; y = targetY; }
      else { x += (targetX - x) * .24; y += (targetY - y) * .24; }
      dot.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;
      if (Math.abs(targetX - x) > .15 || Math.abs(targetY - y) > .15) frame = requestAnimationFrame(draw);
      else { x = targetX; y = targetY; dot.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%)`; frame = 0; }
    };
    window.addEventListener('pointermove', (event) => {
      targetX = event.clientX; targetY = event.clientY;
      dot.classList.add('is-visible');
      if (!frame) frame = requestAnimationFrame(draw);
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => dot.classList.remove('is-visible'));
  })();
</script></body>
</html>
