  (() => {
    if (!window.matchMedia('(pointer: fine)').matches) return;
    const dot = document.createElement('span');
    dot.className = 'cursor-dot';
    dot.setAttribute('aria-hidden', 'true');
    document.body.appendChild(dot);
    let targetX = -20, targetY = -20, x = -20, y = -20, frame = 0;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const draw = () => {
      if (reducedMotion) { x = targetX; y = targetY; }
      else { x += (targetX - x) * .24; y += (targetY - y) * .24; }
      dot.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;
      if (Math.abs(targetX - x) > .15 || Math.abs(targetY - y) > .15) frame = requestAnimationFrame(draw);
      else { x = targetX; y = targetY; dot.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%)`; frame = 0; }
    };
    window.addEventListener('pointermove', (event) => {
      targetX = event.clientX; targetY = event.clientY;
      dot.classList.add('is-visible');
      if (!frame) frame = requestAnimationFrame(draw);
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => dot.classList.remove('is-visible'));
  })();
</script>
